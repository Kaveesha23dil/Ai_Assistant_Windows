[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
filterwarnings =
    error
    ignore::DeprecationWarning:httpx.*
addopts = -q --strict-markers
markers =
    performance: measures latency. These assert a shape rather than a number, because an
        assertion on wall-clock time fails on a loaded CI machine and teaches people to ignore it.
